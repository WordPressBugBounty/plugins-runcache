# BEGIN RunCache LiteSpeed
# RunCache Plugin: LiteSpeed cache enable rules.
# Bugs or questions? Email support@runcloud.io.
<IfModule LiteSpeed>
    CacheEngine on
    CacheEnable public
    CacheLookup on
</IfModule>
<IfModule Litespeed>
    RewriteEngine On
    RewriteRule .* - [E=cache-control:max-age=3600]
</IfModule>
# END RunCache LiteSpeed
