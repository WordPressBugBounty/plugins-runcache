# RunCache: Nginx Cache is disabled.
# This empty file is kept intentionally so an nginx reload does not fail while
# the include directive below is still present in your Nginx server block.
# To fully remove RunCache: remove the include line from your Nginx config,
# reload nginx, then delete this file.
# Bugs or questions? Email support@runcloud.io.

# Deny direct access to this config file
location ~ /runcache-nginx\.conf$ {
    deny all;
    return 404;
}

# Visitors can never fetch internal state (.meta, preload queue, stats) by URL.
# The .meta files stay on disk when the provider is disabled. Keep these rules.
location ~* /wp-content/cache/runcache/.*\.(json|meta)$ {
    deny all;
    return 404;
}
