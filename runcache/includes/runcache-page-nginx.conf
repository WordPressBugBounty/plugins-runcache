# RunCache Plugin: Nginx rules for serving cached pages.
# Bugs or questions? Email support@runcloud.io.

# Deny direct access to this config file
location ~ /runcache-nginx\.conf$ {
    deny all;
    return 404;
}

# Internal cache state (config, preload queue, stats) is never URL-served.
# Convention: only *.html in this directory is served over HTTP.
# Any new non-HTML internal file here must stay covered by these deny rules.
location ~* /wp-content/cache/runcache/.*\.(json|meta)$ {
    deny all;
    return 404;
}

# Add cache headers for served HTML files
location ~* /wp-content/cache/runcache/.*\.html$ {
    add_header X-RunCache-Status HIT;
    add_header X-RunCache-Type Nginx;
    expires 8h;
}

# Base directory for RunCache static files (URI path for rewrite, filesystem path for existence check)
set $runcache_cache_base_uri "/wp-content/cache/runcache";
set $runcache_cache_base_fs "${document_root}/wp-content/cache/runcache";

# Default to serving the cache unless a rule disables it
set $runcache_serve_cache 1;

# Check if nginx cache is enabled for this host via marker file
set $runcache_enabled_file "${runcache_cache_base_fs}/.enabled-nginx-${host}";
if (!-f $runcache_enabled_file) {
    set $runcache_serve_cache 0;
}

# Disable cache for non-GET requests
if ($request_method != GET) {
    set $runcache_serve_cache 0;
}

# Skip cache for WordPress admin, login, or cron endpoints
if ($uri ~* ^/(\.well-known|wp-admin|wp-login\.php|wp-cron\.php|wp-signup\.php|wp-activate\.php|wp-comments-post\.php)) {
    set $runcache_serve_cache 0;
}

# Skip cache for REST API, XML-RPC, and feeds
if ($uri ~* ^/(wp-json|xmlrpc\.php|index\.php/feed|feed/?|wp-json/)) {
    set $runcache_serve_cache 0;
}

# Skip cache for XML sitemaps (WP core, Yoast, RankMath, etc.)
if ($uri ~* (^|/).*sitemap.*\.xml$) {
    set $runcache_serve_cache 0;
}

# Skip cache for WooCommerce cart/checkout/account endpoints
if ($uri ~* ^/(cart|checkout|my-account)) {
    set $runcache_serve_cache 0;
}

# Query compatibility and configurable cookies are evaluated by PHP after a miss.

# Skip cache when mandatory authentication/session cookies are present.
if ($http_cookie ~* "(wp-postpass|wordpress_logged_in|wordpress_sec_|comment_author|wp-settings-)") {
    set $runcache_serve_cache 0;
}

# Build the expected cache file path (adds index.html for directory-style URLs)
set $runcache_cache_file_uri "${runcache_cache_base_uri}/${host}${uri}";
set $runcache_cache_file_fs "${runcache_cache_base_fs}/${host}${uri}";
if ($uri ~ /$) {
    set $runcache_cache_file_uri "${runcache_cache_file_uri}index.html";
    set $runcache_cache_file_fs "${runcache_cache_file_fs}index.html";
}

# Check if cache file exists; if not, fall through to WordPress
if (!-f $runcache_cache_file_fs) {
    set $runcache_serve_cache 0;
}

# Serve cache file directly if all conditions pass
if ($runcache_serve_cache = 1) {
    rewrite ^ "$runcache_cache_file_uri" break;
}
